backend:
  name: github
  repo: Fengyue-Yj/wuxian
  branch: master
  commit_messages:
    create: '发布{{collection}}：{{slug}}'
    update: '更新{{collection}}：{{slug}}'
    delete: '删除{{collection}}：{{slug}}'
    uploadMedia: '上传媒体：{{path}}'
    deleteMedia: '删除媒体：{{path}}'

display_url: "https://fengyue-yj.github.io/wuxian/"
media_folder: "public/images"
public_folder: "/wuxian/images"

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        svg:
          optimize: true

collections:
  - name: "essays"
    label: "随笔"
    folder: "content/essays"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "作者", name: "author", widget: "string", required: false}
      - {label: "摘要", name: "excerpt", widget: "text", required: false}
      - {label: "正文", name: "body", widget: "markdown"}
